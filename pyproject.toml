[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "return-risk-scorer"
version = "0.1.0"
description = "Return-risk scorer with visual verification for e-commerce fraud detection"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pyright]
include = ["."]
extraPaths = ["."]

